<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容管理</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    input, textarea { width: 100%; box-sizing: border-box; margin: .3rem 0; padding: .5rem; }
    .row { border-bottom: 1px solid #eee; padding: .8rem 0; display: flex; justify-content: space-between; align-items: center; }
    button { cursor: pointer; padding: .4rem .8rem; }
    .err { color: #c0392b; }
  </style>
</head>
<body>
  <h1>内容管理</h1>
  <p>管理密码：<input id="pwd" type="password" placeholder="输入管理密码" style="width:200px"></p>
  <h3>新增</h3>
  <input id="title" placeholder="标题">
  <textarea id="content" placeholder="内容" rows="3"></textarea>
  <button onclick="add()">添加</button>

  <h3>现有内容</h3>
  <div id="list"></div>

  <script>
    const pwd = () => document.getElementById('pwd').value;
    const H = () => ({ 'Content-Type': 'application/json', 'x-admin-password': pwd() });
    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    // 统一解析响应：把后端返回的错误信息提取出来
    async function parse(r) {
      let data = null;
      try { data = await r.json(); } catch (e) { /* 非 JSON */ }
      if (!r.ok) {
        const msg = (data && (data.message || data.error)) || ('HTTP ' + r.status);
        throw new Error(r.status === 401 ? '密码错误' : msg);
      }
      return data;
    }

    async function load() {
      const el = document.getElementById('list');
      try {
        const items = await parse(await fetch('/api/items'));
        if (!Array.isArray(items)) throw new Error('返回数据格式异常');
        el.innerHTML = items.length
          ? items.map(i => `<div class="row"><span>${esc(i.title)}</span><button onclick="del(${i.id})">删除</button></div>`).join('')
          : '暂无内容';
      } catch (e) {
        el.innerHTML = `<div class="err">加载失败：${esc(e.message)}</div>`;
      }
    }

    async function add() {
      try {
        await parse(await fetch('/api/items', {
          method: 'POST', headers: H(),
          body: JSON.stringify({ title: document.getElementById('title').value, content: document.getElementById('content').value })
        }));
      } catch (e) {
        return alert('失败：' + e.message);
      }
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
      load();
    }

    async function del(id) {
      if (!confirm('确定删除？')) return;
      try {
        await parse(await fetch('/api/items/' + id, { method: 'DELETE', headers: H() }));
      } catch (e) {
        return alert('失败：' + e.message);
      }
      load();
    }

    load();
  </script>
</body>
</html>
