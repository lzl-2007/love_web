<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容管理 · 我们的小天地</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <div class="sec-head">
      <a class="back" href="/">← 返回首页</a>
      <h1>⚙️ 内容管理</h1>
      <div class="top-actions"><span class="count" id="count"></span></div>
    </div>

    <div class="panel">
      <h3>管理密码</h3>
      <input id="pwd" class="form-input" type="password" placeholder="输入管理密码（增删改需要）" autocomplete="off">
    </div>

    <div class="panel">
      <h3>新增一条</h3>
      <input id="title" class="form-input" placeholder="标题，比如：2026 秋天的公园">
      <textarea id="content" class="form-input" placeholder="内容。想放进「相片回忆」的话，直接把图片链接粘贴在这里就行～"></textarea>
      <button class="btn-solid" onclick="add()">添加</button>
    </div>

    <h3 style="margin:1.5rem 0 .8rem; font-size:1rem">现有内容</h3>
    <div id="list"></div>
  </div>

  <script>
    const pwd = () => document.getElementById('pwd').value;
    // 管理密码同时当查看密码用（读取 + 增删改都能过）
    const H = () => ({
      'Content-Type': 'application/json',
      'x-admin-password': pwd(),
      'x-view-password': pwd()
    });

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    // 分区内容用 [相片]/[日记]/[时光轴] 前缀做标记，这里把标记剥掉再展示
    const CAT = { '相片': '相册', '日记': '日记', '时光轴': '时光轴' };
    function labelOf(title) {
      const m = /^\[(相片|日记|时光轴)\]\s*(.*)$/.exec(title || '');
      if (!m) return { cat: '', text: title || '（无标题）' };
      return { cat: CAT[m[1]], text: m[2] || '（无内容）' };
    }

    // 统一解析响应：把后端返回的错误信息提取出来
    async function parse(r) {
      let data = null;
      try { data = await r.json(); } catch (e) { /* 非 JSON */ }
      if (!r.ok) {
        const msg = (data && (data.message || data.error)) || ('HTTP ' + r.status);
        throw new Error(r.status === 401 ? '密码错误' : msg);
      }
      return data;
    }

    async function load() {
      const el = document.getElementById('list');
      try {
        const items = await parse(await fetch('/api/items', { headers: H() }));
        if (!Array.isArray(items)) throw new Error('返回数据格式异常');
        document.getElementById('count').textContent = items.length ? items.length + ' 条' : '';
        el.innerHTML = items.length
          ? items.map(i => {
              const L = labelOf(i.title);
              return `<div class="admin-row">
                <span class="t">${esc(L.text)}${L.cat ? ` <em class="cat">${esc(L.cat)}</em>` : ''}</span>
                <button class="del" onclick="del(${i.id})">删除</button>
              </div>`;
            }).join('')
          : '<div class="empty"><span class="big">🌱</span><p>还没有内容</p></div>';
      } catch (e) {
        el.innerHTML = `<div class="empty"><p class="err">加载失败：${esc(e.message)}</p></div>`;
      }
    }

    async function add() {
      const title = document.getElementById('title').value;
      if (!title.trim()) return alert('标题不能为空');
      try {
        await parse(await fetch('/api/items', {
          method: 'POST', headers: H(),
          body: JSON.stringify({ title, content: document.getElementById('content').value })
        }));
      } catch (e) {
        return alert('失败：' + e.message);
      }
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
      load();
    }

    async function del(id) {
      if (!confirm('确定删除？')) return;
      try {
        await parse(await fetch('/api/items/' + id, { method: 'DELETE', headers: H() }));
      } catch (e) {
        return alert('失败：' + e.message);
      }
      load();
    }

    load();
  </script>
</body>
</html>
